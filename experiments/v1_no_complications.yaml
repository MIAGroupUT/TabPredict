# ─────────────────────────────────────────────────────────────────────────────
# Experiment: v1_no_complications:
#   - WeightedRandomSampler added      (50/50 balanced batches)
#   - clinical_branch: MLP → linear probe  (no hidden layer; prevents overfitting
#                                            with ~37 training positives)
#   - gate_l1_weight 0.0005 → 0.005   (10× sparsity; forces gate to ~20-30 features)
#   - focal_gamma 2.0 → 3.0           (harder gradient on mid-prob hard examples)
#   - pos_weight 1.0 → 2.0            (asymmetric gradient favouring recall)
#   - p_cta 0.10 → 0.0               (CTA confirmed useful by ablation; stop dropping it)
#   - reintervention_head output: 2 → 1  (remove logvar; plain focal BCE)
#   - confidence: logvar-based → 2*|prob-0.5|  (self-calibrating; no post-hoc tuning)
#   - Stage B: layer4 conv unfrozen   (task-specific fine-tuning of Merlin backbone)
# ─────────────────────────────────────────────────────────────────────────────

name: v1_no_complications
version: 1
description: >
  Primary-task-only reintervention risk model.
  v1 adds stronger regularisation (heavier gate L1, bigger dropout, tighter
  FiLM clamp, higher weight_decay) and enables modality dropout in Stage A
  to prevent clinical feature memorisation.

model:
  with_complications: false
  complications: []
  aaa_dim: 5

training:
  seed: 3299
  batch_size: 8
  num_workers: 8
  image_size: [224, 224, 160]
  voxel_spacing: [1.5, 1.5, 3]
  hu_range: [-1000, 1000]
  train_cache_rate: 0.5
  val_cache_rate: 1.0

  # Loss hyperparameters
  focal_gamma: 3.0           # harder gradient on mid-prob borderline examples
  label_smoothing: 0.02
  pos_weight: 2.0            # asymmetric gradient favouring recall over precision
  gate_l1_weight: 0.005      # 10× sparsity forces gate to ~20-30 features (37 train pos)
  recall_beta: 2.0           # checkpoint saved by F2-score (recall-weighted)
  threshold_recall_target: 0.80  # threshold saved = smallest t giving ≥80% recall on val

  # Causal modality dropout — applied in BOTH Stage A and Stage B
  modality_dropout:
    p_cta: 0.0               # CTA confirmed useful by ablation; never drop it
    p_aaa_given_cta: 0.15
    p_aaa_given_clin: 0.15
    p_clinical: 0.15         # 0.30 too aggressive with only ~37 train positives

  xai_every_n_epochs: 3
  xai_samples: 4
  xai_gradcam: true

  stages:
    - name: A
      epochs: 60
      patience: 12
      T_0: 20

    - name: B
      epochs: 150
      patience: 20
      T_0: 30

paths:
  base_dir: /deepstore/datasets/mia/AI4EVAR/derivatives/training_subset_v1
  checkpoint_dir: /home/ranema/AI4EVAR/checkpoints/v1_no_complications

wandb:
  project: AAA-Reintervention-Risk
  run_name: v1_no_complications
  mode: online
