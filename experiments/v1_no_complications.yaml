# ─────────────────────────────────────────────────────────────────────────────
# Experiment: v1_no_complications:
#   - gate_l1_weight 0.0001 → 0.002  (10× stronger clinical feature sparsity)
#   - label_smoothing 0.02 → 0.05
#   - p_clinical 0.20 → 0.30         (Stage A now also applies modality dropout)
#   - condition_net 320→256→640      (was 320→512→640; ~50% fewer params)
#   - clinical_branch Dropout 0.2/0.1 → 0.4/0.3
#   - FiLM clamp 0.3 → 0.15
#   - weight_decay 1e-4 → 5e-4
# ─────────────────────────────────────────────────────────────────────────────

name: v1_no_complications
version: 1
description: >
  Primary-task-only reintervention risk model.
  v1 adds stronger regularisation (heavier gate L1, bigger dropout, tighter
  FiLM clamp, higher weight_decay) and enables modality dropout in Stage A
  to prevent clinical feature memorisation.

model:
  with_complications: false
  complications: []
  aaa_dim: 5

training:
  seed: 3299
  batch_size: 8
  num_workers: 8
  image_size: [128, 128, 128]
  voxel_spacing: [1.5, 1.5, 1.5]
  hu_range: [-200, 400]
  train_cache_rate: 0.5
  val_cache_rate: 1.0

  # Loss hyperparameters
  focal_gamma: 2.0
  label_smoothing: 0.05
  pos_weight: 4.58           # N_neg/N_pos in training set (302/66)
  gate_l1_weight: 0.002      # was 0.0001; strong sparsity on 241 clinical features
  recall_beta: 2.0

  # Causal modality dropout — applied in BOTH Stage A and Stage B
  modality_dropout:
    p_cta: 0.10
    p_aaa_given_cta: 0.15
    p_aaa_given_clin: 0.15
    p_clinical: 0.30         # was 0.20; also active in Stage A now

  xai_every_n_epochs: 3
  xai_samples: 4
  xai_gradcam: true

  stages:
    - name: A
      epochs: 60
      patience: 12
      T_0: 20

    - name: B
      epochs: 150
      patience: 20
      T_0: 30

paths:
  base_dir: /deepstore/datasets/mia/AI4EVAR/derivatives/training_subset_v1
  cache_dir: /deepstore/datasets/mia/AI4EVAR/derivatives/monai_cache
  checkpoint_dir: /home/ranema/AI4EVAR/checkpoints/v1_no_complications

wandb:
  project: AAA-Reintervention-Risk
  run_name: v1_no_complications
  mode: online
