# ─────────────────────────────────────────────────────────────────────────────
# Experiment: v1_no_complications (v2 hyperparams):
#   - WeightedRandomSampler added      (50/50 balanced batches; replaces inflated pos_weight)
#   - gate_l1_weight 0.002 → 0.0005   (loosen feature sparsity; stop zeroing signal)
#   - label_smoothing 0.05 → 0.02     (let positives look more positive)
#   - clinical_branch Dropout 0.4/0.3 → 0.3/0.2  (less aggressive; in model code)
#   - FiLM clamp 0.15 → 0.3           (allow fusion to modulate more; in model code)
#   - checkpoint criterion: AUC → F2  (recall-weighted; in trainer)
# ─────────────────────────────────────────────────────────────────────────────

name: v1_no_complications
version: 1
description: >
  Primary-task-only reintervention risk model.
  v1 adds stronger regularisation (heavier gate L1, bigger dropout, tighter
  FiLM clamp, higher weight_decay) and enables modality dropout in Stage A
  to prevent clinical feature memorisation.

model:
  with_complications: false
  complications: []
  aaa_dim: 5

training:
  seed: 3299
  batch_size: 8
  num_workers: 8
  image_size: [224, 224, 160]
  voxel_spacing: [1.5, 1.5, 3]
  hu_range: [-1000, 1000]
  train_cache_rate: 0.5
  val_cache_rate: 1.0

  # Loss hyperparameters
  focal_gamma: 2.0
  label_smoothing: 0.02
  pos_weight: 1.0            # WRS already balances batches 50/50; no double-correction
  gate_l1_weight: 0.0005     # gentle sparsity; 0.002 was zeroing too many features
  recall_beta: 2.0           # checkpoint saved by F2-score (recall-weighted)
  threshold_recall_target: 0.80  # threshold saved = smallest t giving ≥80% recall on val

  # Causal modality dropout — applied in BOTH Stage A and Stage B
  modality_dropout:
    p_cta: 0.10
    p_aaa_given_cta: 0.15
    p_aaa_given_clin: 0.15
    p_clinical: 0.15         # 0.30 too aggressive with only ~37 train positives

  xai_every_n_epochs: 3
  xai_samples: 4
  xai_gradcam: true

  stages:
    - name: A
      epochs: 60
      patience: 12
      T_0: 20

    - name: B
      epochs: 150
      patience: 20
      T_0: 30

paths:
  base_dir: /deepstore/datasets/mia/AI4EVAR/derivatives/training_subset_v1
  checkpoint_dir: /home/ranema/AI4EVAR/checkpoints/v1_no_complications
  cache_dir: /deepstore/datasets/mia/AI4EVAR/derivatives/monai_cache

wandb:
  project: AAA-Reintervention-Risk
  run_name: v1_no_complications
  mode: online
