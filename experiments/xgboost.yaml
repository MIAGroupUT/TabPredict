# ─────────────────────────────────────────────────────────────────────────────
# Experiment: xgboost
#   XGBoost as the tabular backbone (replaces MLP/TabM).
#   Requires: pip install xgboost
#   scale_pos_weight is set automatically from training class counts.
# ─────────────────────────────────────────────────────────────────────────────

name: xgboost
version: 1
description: >
  XGBoost tabular backbone + frozen/adapted Merlin visual branch.
  Baseline comparison for MLP and TabM.

model:
  with_complications: false
  complications: []
  aaa_dim: 5
  clinical_backbone: xgboost
  backbone_cfg:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 3
    reg_alpha: 0.1
    reg_lambda: 1.0
    use_tree_output: false   # scalar prob → Linear(1→32); avoids high-dim TreeSHAP projection

training:
  seed: 3299
  batch_size: 8
  num_workers: 4
  image_size: [224, 224, 160]
  voxel_spacing: [1.5, 1.5, 3]
  hu_range: [-1000, 1000]
  train_cache_rate: 0.5
  val_cache_rate: 1.0

  focal_gamma: 2.0
  label_smoothing: 0.02
  pos_weight: 1.0
  max_missing_pct: 0.5
  gate_l1_weight: 0.0
  recall_beta: 2.0
  selection_metric: fbeta        # fbeta | auroc
  freeze_clinical_in_stage_b: true  # true → clinical branch frozen in Stage B (visual-only fine-tune)

  modality_dropout:
    p_cta: 0.0
    p_aaa_given_cta: 0.15
    p_aaa_given_clin: 0.15
    p_clinical: 0.0

  xai_every_n_epochs: 999
  xai_samples: 4
  xai_gradcam: true

  stages:
    - name: A
      epochs: 60
      patience: 15
      T_0: 20

    - name: B
      epochs: 100
      patience: 20
      T_0: 30

paths:
  base_dir:       /deepstore/datasets/mia/AI4EVAR/derivatives/training_subset_v1
  checkpoint_dir: /deepstore/datasets/mia/AI4EVAR/TabPredict/models_no_umcg_fbeta/xgboost

wandb:
  project: AAA-Reintervention-Risk-MultiTab
  run_name: xgboost_no_umcg_fbeta
  mode:     online
