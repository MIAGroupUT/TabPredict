# ─────────────────────────────────────────────────────────────────────────────
# Experiment: v1_with_complications
# Model:      Multi-task reintervention + per-complication prediction
#             Same backbone as v1_no_complications + complications_head
# ─────────────────────────────────────────────────────────────────────────────

name: v1_with_complications
version: 1
description: >
  Multi-task model predicting reintervention risk AND the probability of each
  individual complication (endoleaks, migration, infection).
  Complication logits provide XAI-grade attribution for the main prediction.

model:
  with_complications: true
  complications:
    # Endoleaks (granular)
    - endoleak_1a
    - endoleak_1b
    - endoleak_2
    - endoleak_3
    - endoleak_5
    # Endograft-specific
    - migration
    - infection
  lora_r: 8
  aaa_dim: 5

training:
  seed: 3299
  batch_size: 8
  num_workers: 16
  image_size: [128, 128, 128]
  voxel_spacing: [1.5, 1.5, 1.5]
  hu_range: [-200, 400]
  train_cache_rate: 0.5
  val_cache_rate: 1.0

  # Loss hyperparameters
  focal_gamma: 2.0
  label_smoothing: 0.02      # Reduced: small dataset benefits from sharper targets
  pos_weight: 3.0            # Extra penalty on FN on top of 50/50 balanced sampler
  gate_l1_weight: 0.0001     # Reduced: allow more clinical features through the gate
  recall_beta: 2.0           # F-beta threshold selection; beta>1 weights recall over precision

  # comp_weight is set per-stage; low in A (sparse labels + frozen backbone),
  # higher in B once LoRA visual features are available
  comp_weight_stage_a: 0.1
  comp_weight_stage_b: 0.3

  # Causal modality dropout (Stage B only)
  modality_dropout:
    p_cta: 0.10
    p_aaa_given_cta: 0.15
    p_aaa_given_clin: 0.15
    p_clinical: 0.20        # Force visual branch by randomly hiding clinical features

  # XAI logging during training
  xai_every_n_epochs: 3     # run full_explain on val samples every N epochs
  xai_samples: 4            # number of val patients to explain per run
  xai_gradcam: true         # true to also compute GradCAM (slower; needs I3ResNet)

  stages:
    - name: A
      epochs: 60
      patience: 12
      T_0: 20

    - name: B
      epochs: 150
      patience: 20
      T_0: 30

paths:
  base_dir: /deepstore/datasets/mia/AI4EVAR/derivatives/training_subset_v1
  cache_dir: /deepstore/datasets/mia/AI4EVAR/derivatives/monai_cache_comp
  checkpoint_dir: /home/ranema/AI4EVAR/checkpoints/v1_with_complications

wandb:
  project: AAA-Reintervention-Risk
  run_name: v1_with_complications
  mode: online    # set to "offline" or "disabled" to skip W&B cloud sync
