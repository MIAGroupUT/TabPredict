# ─────────────────────────────────────────────────────────────────────────────
# Experiment: v1_with_complications (v2 hyperparams):
#   - WeightedRandomSampler added      (50/50 balanced batches; replaces inflated pos_weight)
#   - gate_l1_weight 0.002 → 0.0005   (loosen feature sparsity)
#   - label_smoothing 0.05 → 0.02     (let positives look more positive)
#   - comp_weight_stage_a 0.1 → 0.01  (Stage A warms up reintervention head cleanly)
#   - clinical_branch Dropout 0.4/0.3 → 0.3/0.2  (in model code)
#   - FiLM clamp 0.15 → 0.3           (in model code)
#   - checkpoint criterion: AUC → F2  (in trainer)
#   - comp_loss_weights: per-complication contribution to comp gradient
#       scaled by sqrt(N_pos_train / N_pos_max) to down-weight rare tasks
#   - comp_pos_weights: per-complication N_neg/N_pos (capped at 20 for stability)
#       computed from estimated training counts (N_train ≈ 368 = 530 − 111 − 51)
#
# Complication training-set estimates (530 total × 368/530 ≈ 69.4%):
#   endoleak_1a :  ~22 pos  → pos_w = (368-22)/22  ≈ 15.7  → 16.0
#   endoleak_1b :  ~36 pos  → pos_w = (368-36)/36  ≈  9.2  →  9.0
#   endoleak_2  : ~119 pos  → pos_w = (368-119)/119 ≈ 2.1  →  2.1
#   endoleak_3  :   ~6 pos  → pos_w ≈ 60  → capped at 20.0
#   endoleak_5  :  ~22 pos  → pos_w ≈ 15.7 → 16.0
#   migration   :   ~8 pos  → pos_w ≈ 45   → capped at 20.0
#   infection   :   ~6 pos  → pos_w ≈ 60   → capped at 20.0
# ─────────────────────────────────────────────────────────────────────────────

name: v1_with_complications
version: 1
description: >
  Multi-task model predicting reintervention risk AND per-complication probability.
  v1 adds per-complication pos_weights and loss_weights alongside the same
  regularisation improvements as v1_no_complications.

model:
  with_complications: true
  complications:
    - endoleak_1a
    - endoleak_1b
    - endoleak_2
    - endoleak_3
    - endoleak_5
    - migration
    - infection
  aaa_dim: 5

training:
  seed: 3299
  batch_size: 8
  num_workers: 16
  image_size: [224, 224, 160]
  voxel_spacing: [1.5, 1.5, 3]
  hu_range: [-1000, 1000]
  train_cache_rate: 0.5
  val_cache_rate: 1.0

  # Loss hyperparameters
  focal_gamma: 2.0
  label_smoothing: 0.02
  pos_weight: 4.58           # raw N_neg/N_pos ratio; sampler already balances batches 50/50
  gate_l1_weight: 0.0005     # gentle sparsity; 0.002 was zeroing too many features
  recall_beta: 2.0           # checkpoint saved by F2-score (recall-weighted)

  comp_weight_stage_a: 0.01  # near-zero in Stage A so reintervention head warms up cleanly
  comp_weight_stage_b: 0.3

  # Per-complication loss weights (relative contribution to comp gradient)
  # Derived from sqrt(N_pos / N_pos_max) to avoid noisy rare tasks dominating
  comp_loss_weights:
    endoleak_1a: 0.4    # ~22 train pos; sqrt(22/119) ≈ 0.43
    endoleak_1b: 0.6    # ~36 train pos; sqrt(36/119) ≈ 0.55
    endoleak_2:  1.0    # ~119 train pos; anchor (most common)
    endoleak_3:  0.1    # ~6 train pos; only 2 centres have any positives
    endoleak_5:  0.4    # ~22 train pos
    migration:   0.3    # ~8 train pos
    infection:   0.2    # ~6 train pos

  # Per-complication pos_weights (N_neg / N_pos in training split, capped at 20)
  comp_pos_weights:
    endoleak_1a: 16.0
    endoleak_1b:  9.0
    endoleak_2:   2.1
    endoleak_3:  20.0
    endoleak_5:  16.0
    migration:   20.0
    infection:   20.0

  # Causal modality dropout — applied in BOTH Stage A and Stage B
  modality_dropout:
    p_cta: 0.10
    p_aaa_given_cta: 0.15
    p_aaa_given_clin: 0.15
    p_clinical: 0.30

  xai_every_n_epochs: 3
  xai_samples: 4
  xai_gradcam: true

  stages:
    - name: A
      epochs: 60
      patience: 12
      T_0: 20

    - name: B
      epochs: 150
      patience: 20
      T_0: 30

paths:
  base_dir: /deepstore/datasets/mia/AI4EVAR/derivatives/training_subset_v1
  checkpoint_dir: /home/ranema/AI4EVAR/checkpoints/v1_with_complications
  cache_dir: /deepstore/datasets/mia/AI4EVAR/derivatives/monai_cache_comp

wandb:
  project: AAA-Reintervention-Risk
  run_name: v1_with_complications
  mode: online
