# ─────────────────────────────────────────────────────────────────────────────
# Experiment: v1_with_complications (v3 hyperparams):
#   - WeightedRandomSampler added      (50/50 balanced batches; replaces inflated pos_weight)
#   - pos_weight 1.0; WRS handles class balance — no double-correction
#   - gate_l1_weight 0.0005            (gentle sparsity; 0.005 zeroed too many features)
#   - focal_gamma 2.0                  (γ=3 destabilised training under 50/50 sampler)
#   - p_cta 0.0                        (CTA confirmed useful by ablation; never drop)
#   - reintervention_head output: 1    (remove logvar; plain focal BCE)
#   - confidence: 2*|prob-0.5|         (self-calibrating; no post-hoc tuning)
#   - Stage B: BN-only adaptation      (layer4 conv fine-tune hurt with ~37 positives)
#   - comp_weight_stage_a 0.1 → 0.01  (Stage A warms up reintervention head cleanly)
#   - comp_loss_weights: per-complication contribution to comp gradient
#       scaled by sqrt(N_pos_train / N_pos_max) to down-weight rare tasks
#   - comp_pos_weights: per-complication N_neg/N_pos (capped at 20 for stability)
#       computed from estimated training counts (N_train ≈ 368 = 530 − 111 − 51)
#
# Complication training-set estimates (actual train N=377, 63 reintervention pos):
#   Prevalence ratios scaled from known 530-patient cohort × 377/530 ≈ 71.1%
#   endoleak_1a :  ~23 pos  → pos_w = (377-23)/23  ≈ 15.4  → 16.0
#   endoleak_1b :  ~37 pos  → pos_w = (377-37)/37  ≈  9.2  →  9.0
#   endoleak_2  : ~122 pos  → pos_w = (377-122)/122 ≈ 2.1  →  2.1
#   endoleak_3  :   ~6 pos  → pos_w ≈ 62  → capped at 20.0
#   endoleak_5  :  ~23 pos  → pos_w ≈ 15.4 → 16.0
#   migration   :   ~8 pos  → pos_w ≈ 46   → capped at 20.0
#   infection   :   ~6 pos  → pos_w ≈ 62   → capped at 20.0
# ─────────────────────────────────────────────────────────────────────────────

name: v1_with_complications
version: 1
description: >
  Multi-task model predicting reintervention risk AND per-complication probability.
  v1 adds per-complication pos_weights and loss_weights alongside the same
  regularisation improvements as v1_no_complications.

model:
  with_complications: true
  complications:
    - endoleak_1a
    - endoleak_1b
    - endoleak_2
    - endoleak_3
    - endoleak_5
    - migration
    - infection
  aaa_dim: 5
  clinical_backbone: tabm        # mlp | tabm | lr | rf | gbm | xgboost
  backbone_cfg:                 # hyperparameters forwarded to the chosen backbone
    k: 16                       # ensemble members (paper default 32; 16 for small data)
    n_blocks: 2
    d_block: 64                 # was 128; halved to ~4k params/positive (was 10k — too many for 63 positives)
    dropout: 0.3
    num_embeddings: periodic    # periodic | none  (PeriodicEmbeddings lite=True)
    d_embedding: 8              # was 16; halved to match reduced d_block

training:
  seed: 3299
  batch_size: 8
  num_workers: 6
  image_size: [224, 224, 160]
  voxel_spacing: [1.5, 1.5, 3]
  hu_range: [-1000, 1000]
  train_cache_rate: 0.5
  val_cache_rate: 1.0

  # Loss hyperparameters
  focal_gamma: 2.0
  label_smoothing: 0.02
  pos_weight: 1.0            # WRS already balances batches 50/50; raw ratio (314/63=4.98) must NOT be used
  max_missing_pct: 0.5       # drop clinical features missing in ≥50% of train patients
  gate_l1_weight: 0.0001     # reduced: gate now operates on ~42 informative features, not 240
  recall_beta: 2.0           # checkpoint saved by F2-score (recall-weighted)
  freeze_clinical_in_stage_b: true  # true → clinical branch frozen in Stage B (visual-only fine-tune)

  comp_weight_stage_a: 0.01  # near-zero in Stage A so reintervention head warms up cleanly
  comp_weight_stage_b: 0.3

  # Per-complication loss weights (relative contribution to comp gradient)
  # Derived from sqrt(N_pos / N_pos_max) to avoid noisy rare tasks dominating
  comp_loss_weights:
    endoleak_1a: 0.4    # ~22 train pos; sqrt(22/119) ≈ 0.43
    endoleak_1b: 0.6    # ~36 train pos; sqrt(36/119) ≈ 0.55
    endoleak_2:  1.0    # ~119 train pos; anchor (most common)
    endoleak_3:  0.1    # ~6 train pos; only 2 centres have any positives
    endoleak_5:  0.4    # ~22 train pos
    migration:   0.3    # ~8 train pos
    infection:   0.2    # ~6 train pos

  # Per-complication pos_weights (N_neg / N_pos in training split, capped at 20)
  comp_pos_weights:
    endoleak_1a: 16.0
    endoleak_1b:  9.0
    endoleak_2:   2.1
    endoleak_3:  20.0
    endoleak_5:  16.0
    migration:   20.0
    infection:   20.0

  # Causal modality dropout — applied in BOTH Stage A and Stage B
  modality_dropout:
    p_cta: 0.0               # CTA useful by ablation
    p_aaa_given_cta: 0.15
    p_aaa_given_clin: 0.15
    p_clinical: 0.15         # 0.30 too aggressive; 63 train positives is still small

  xai_every_n_epochs: 3
  xai_samples: 4
  xai_gradcam: true

  stages:
    - name: A
      epochs: 60
      patience: 20
      T_0: 20

    - name: B
      epochs: 150
      patience: 20
      T_0: 30

paths:
  base_dir: /deepstore/datasets/mia/AI4EVAR/derivatives/training_subset_v1
  checkpoint_dir: /deepstore/datasets/mia/AI4EVAR/ai4evar_checkpoints/v1_with_complications_TabM

wandb:
  project: AAA-Reintervention-Risk
  run_name: v1_with_complications_TabM
  mode: online
