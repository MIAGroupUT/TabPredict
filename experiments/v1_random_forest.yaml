# ─────────────────────────────────────────────────────────────────────────────
# Experiment: v1_random_forest
#   Random Forest as the tabular backbone (replaces MLP/TabM).
#   Same hybrid pipeline as v1_logistic_regression: RF fitted once pre-Stage-A, then
#   projection + visual branch fine-tuned via backprop.
# ─────────────────────────────────────────────────────────────────────────────

name: v1_random_forest
version: 1
description: >
  Random Forest tabular backbone + frozen/adapted Merlin visual branch.
  Baseline comparison for v1_no_complications (MLP) and v1_with_complications (TabM).

model:
  with_complications: false
  complications: []
  aaa_dim: 5
  clinical_backbone: rf
  backbone_cfg:
    n_estimators: 300
    min_samples_leaf: 2
    use_tree_output: false   # true → Linear(300→32) per-tree probs; false → Linear(1→32) scalar prob

training:
  seed: 3299
  batch_size: 8
  num_workers: 4
  image_size: [224, 224, 160]
  voxel_spacing: [1.5, 1.5, 3]
  hu_range: [-1000, 1000]
  train_cache_rate: 0.5
  val_cache_rate: 1.0

  focal_gamma: 2.0
  label_smoothing: 0.02
  pos_weight: 1.0
  max_missing_pct: 0.5
  gate_l1_weight: 0.0
  recall_beta: 2.0
  freeze_clinical_in_stage_b: true  # true → clinical branch frozen in Stage B (visual-only fine-tune)

  modality_dropout:
    p_cta: 0.0
    p_aaa_given_cta: 0.15
    p_aaa_given_clin: 0.15
    p_clinical: 0.0

  xai_every_n_epochs: 999
  xai_samples: 4
  xai_gradcam: true

  stages:
    - name: A
      epochs: 60
      patience: 15
      T_0: 20

    - name: B
      epochs: 100
      patience: 20
      T_0: 30

paths:
  base_dir:       /deepstore/datasets/mia/AI4EVAR/derivatives/training_subset_v1
  checkpoint_dir: /deepstore/datasets/mia/AI4EVAR/ai4evar_multitab/models/random_forest

wandb:
  project: AAA-Reintervention-Risk-MultiTab
  run_name: random_forest
  mode:     online
